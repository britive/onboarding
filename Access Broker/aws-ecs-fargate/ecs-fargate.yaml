AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Britive Access Broker on ECS Fargate. One service running the broker image
  from ../image, configured entirely by environment: the tenant subdomain as a
  plain variable and the pool token injected from Secrets Manager. The broker
  only makes outbound connections, so there is no load balancer and the task
  security group allows egress only. Place the task in private subnets with a
  NAT route (AssignPublicIp=DISABLED) or, for a quick start, in public subnets
  with a public IP.

Parameters:
  StackNamePrefix:
    Type: String
    Default: britive-broker
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9-]{1,30}"
    Description: Prefix for named resources and for the Secrets Manager secrets the task may read.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the task runs in. It must reach <tenant>.britive-app.com on 443 and your targets.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets for the task. Private subnets with a NAT gateway are recommended
      (set AssignPublicIp=DISABLED); public subnets work with AssignPublicIp=ENABLED.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: ENABLED only when the subnets are public and have no NAT route.
  ImageUri:
    Type: String
    AllowedPattern: ".+"
    Description: >
      Image pushed by ../image/build-and-push.sh, for example
      <account>.dkr.ecr.<region>.amazonaws.com/britive-broker:3.0.2-r1.
      Must match CpuArchitecture.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
    Description: Fargate CPU architecture. The image is built for both; ARM64 is cheaper.
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
      - "2048"
    Description: Fargate task CPU units. The broker itself needs very little; size for your scripts.
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
      - "4096"
    Description: Fargate task memory in MiB.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Number of broker tasks. All share the pool token; Britive load-balances across them.
  BrokerTenantSubdomain:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9.-]*$"
    Description: Britive tenant subdomain, for example acme for acme.britive-app.com.
  BrokerAuthToken:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Broker pool token from System Administration > Brokers and Broker Pools. Stored in Secrets Manager; never visible on the task definition.
  LogFormat:
    Type: String
    Default: json
    AllowedValues:
      - text
      - json
    Description: Broker log format. json is easier to query in CloudWatch Logs Insights.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  EnableAwsBrokerScripts:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Grant the task role what checkout/checkin scripts that call AWS need:
      EC2/RDS discovery, SSM sessions and commands, and read/write of Secrets
      Manager secrets named <StackNamePrefix>/*. Leave false unless your
      scripts use the AWS API.
  EksClusterArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional. EKS cluster ARNs the broker may describe (eks:DescribeCluster)
      so `aws eks update-kubeconfig` works for Kubernetes checkouts. Access
      inside the cluster is granted separately through an EKS access entry
      for the task role.

Conditions:
  AwsBrokerScripts: !Equals [!Ref EnableAwsBrokerScripts, "true"]
  HasEksClusters: !Not [!Equals [!Join ["", !Ref EksClusterArns], ""]]

Resources:
  BrokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${StackNamePrefix}
      RetentionInDays: !Ref LogRetentionDays

  BrokerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${StackNamePrefix}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # The pool token goes through Secrets Manager so NoEcho holds: a plain
  # Environment entry is readable by anyone with ecs:DescribeTaskDefinition.
  BrokerAuthTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackNamePrefix}/broker/auth-token
      Description: Britive broker pool token (BRITIVE_BROKER_AUTH_TOKEN).
      SecretString: !Ref BrokerAuthToken

  BrokerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackNamePrefix}-exec-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadBrokerToken
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref BrokerAuthTokenSecret

  BrokerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackNamePrefix}-task-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcsExec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
        # Checkout scripts run as this role. Opt in, and keep the Secrets
        # Manager grant to secrets under the stack prefix.
        - !If
          - AwsBrokerScripts
          - PolicyName: BrokerScripts
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:DescribeInstances
                    - ec2:DescribeTags
                    - ec2:DescribeSecurityGroups
                    - rds:DescribeDBInstances
                    - rds:DescribeDBClusters
                    - ssm:DescribeInstanceInformation
                    - ssm:DescribeSessions
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - ssm:StartSession
                    - ssm:TerminateSession
                    - ssm:ResumeSession
                    - ssm:SendCommand
                    - ssm:GetCommandInvocation
                  Resource:
                    - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/*
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartSSHSession
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunPowerShellScript
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:PutSecretValue
                    - secretsmanager:UpdateSecret
                    - secretsmanager:DescribeSecret
                    - secretsmanager:CreateSecret
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StackNamePrefix}/*
                - Effect: Allow
                  Action: secretsmanager:ListSecrets
                  Resource: "*"
          - !Ref AWS::NoValue
        - !If
          - HasEksClusters
          - PolicyName: EksDescribe
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: eks:DescribeCluster
                  Resource: !Ref EksClusterArns
          - !Ref AWS::NoValue

  # Egress only. The broker never listens.
  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Britive Access Broker task - outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackNamePrefix}-task-sg

  BrokerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackNamePrefix}-task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref CpuArchitecture
      ExecutionRoleArn: !GetAtt BrokerExecutionRole.Arn
      TaskRoleArn: !GetAtt BrokerTaskRole.Arn
      ContainerDefinitions:
        - Name: broker
          Image: !Ref ImageUri
          Essential: true
          # The image already runs as uid 1000; stated here so a different
          # image cannot silently run the broker as root.
          User: "1000"
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: BRITIVE_BROKER_TENANT_SUBDOMAIN
              Value: !Ref BrokerTenantSubdomain
            - Name: BRITIVE_BROKER_LOG_FORMAT
              Value: !Ref LogFormat
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: BRITIVE_BROKER_AUTH_TOKEN
              ValueFrom: !Ref BrokerAuthTokenSecret
          HealthCheck:
            Command:
              - CMD-SHELL
              - pgrep -f '^/opt/britive-broker/britive-broker( |$)' >/dev/null || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BrokerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: broker

  BrokerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${StackNamePrefix}-service
      Cluster: !Ref BrokerCluster
      TaskDefinition: !Ref BrokerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref BrokerSecurityGroup
          Subnets: !Ref SubnetIds

Outputs:
  ClusterName:
    Value: !Ref BrokerCluster
  ServiceName:
    Value: !Ref BrokerService
  TaskRoleArn:
    Description: Grant this role access to targets (EKS access entries, RDS IAM auth, extra Secrets Manager secrets under the prefix).
    Value: !GetAtt BrokerTaskRole.Arn
  LogGroupName:
    Value: !Ref BrokerLogGroup
  BrokerAuthTokenSecretArn:
    Description: Rotate the pool token by updating the BrokerAuthToken parameter; tasks pick it up on the next deployment.
    Value: !Ref BrokerAuthTokenSecret
