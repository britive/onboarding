[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:britive-broker]
command=/root/start-broker.sh 5
stdout_logfile=/var/log/supervisor/broker.log
stderr_logfile=/var/log/supervisor/broker.log
autostart=true
autorestart=true
# Do NOT set environment= here. Omitting it causes supervisord to inherit the full
# parent environment, which passes all ECS-injected secrets and env vars (BRITIVE_TOKEN,
# KUBECONFIG_BASE64, EKS_CLUSTER_NAME, AWS_REGION, BROKER_*, etc.) to the broker process.
# Setting environment= would replace the environment entirely, causing those vars to be lost.
stopasgroup=true
