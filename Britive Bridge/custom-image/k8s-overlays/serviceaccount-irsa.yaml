# IRSA service account for the Bridge broker (Aurora MySQL example).
# Lets the pod call AWS Secrets Manager WITHOUT static AWS keys — the EKS OIDC
# provider exchanges this SA's projected token for the IAM role's credentials.
#
# Prereqs (one-time, per cluster):
#   1. Associate an OIDC provider with the cluster:
#        eksctl utils associate-iam-oidc-provider --cluster <name> --approve
#   2. Create an IAM role whose trust policy allows this SA
#      (system:serviceaccount:britive-bridge:britive-bridge) and which grants
#      secretsmanager:GetSecretValue on your DB master secret. Easiest:
#        eksctl create iamserviceaccount \
#          --cluster <name> --namespace britive-bridge \
#          --name britive-bridge \
#          --attach-policy-arn arn:aws:iam::<account-id>:policy/<bridge-secrets-read> \
#          --approve --override-existing-serviceaccounts
#      (eksctl will create/annotate this same SA for you — in that case you can
#       skip applying this file and just reference serviceAccountName below.)
#
# If you create the role by hand, fill in the ARN annotation and apply this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: britive-bridge
  namespace: britive-bridge
  annotations:
    # IAM role with secretsmanager:GetSecretValue on the DB master secret.
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<britive-bridge-secrets-role>
