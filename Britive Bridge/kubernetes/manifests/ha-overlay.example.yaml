# Optional: high-availability overlay. Apply AFTER the base manifests to run
# multiple Bridge replicas. Requires a ReadWriteMany (RWM) volume so all pods
# can share /data — RWO will NOT schedule a second pod.
#
# RWM storage by platform:
#   - AWS  : EFS CSI driver  (storageClassName: efs-sc)
#   - Azure: Azure Files     (storageClassName: azurefile-csi)
#   - GCP  : Filestore       (storageClassName: filestore-csi / standard-rwx)
#
# Apply order:
#   1. kubectl apply -f namespace.yaml
#   2. create the bridge-broker secret (secret.example.yaml or ESO)
#   3. kubectl apply -f ha-overlay.example.yaml   # RWM PVC instead of pvc.yaml
#   4. kubectl apply -f deployment.yaml service.yaml ingress.yaml
#   5. patch the Deployment for replicas + rolling updates (see below)
---
# RWM PVC — replaces pvc.yaml for HA. Do not apply both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bridge-data
  namespace: britive-bridge
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: efs-sc          # set to your RWM storage class
---
# Patch the base Deployment for HA: more replicas + rolling updates instead of
# Recreate (safe now that the volume is RWM). Apply with:
#   kubectl -n britive-bridge patch deployment britive-bridge \
#     --type merge --patch-file ha-overlay.example.yaml --dry-run=client
# or fold these fields into deployment.yaml directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: britive-bridge
  namespace: britive-bridge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      affinity:
        podAntiAffinity:            # spread replicas across nodes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: britive-bridge
