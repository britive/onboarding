# Optional: source the broker credentials from an external secret store via the
# External Secrets Operator (ESO) instead of a raw Kubernetes Secret.
#
# Prerequisites:
#   - ESO installed in the cluster:
#       helm install external-secrets oci://registry-1.docker.io/externalsecrets/external-secrets \
#         -n external-secrets --create-namespace
#   - A backend holding the values (AWS Secrets Manager shown; Vault/GCP/Azure
#     work the same way with a different SecretStore provider).
#   - The pod/IRSA/workload identity has read access to that backend secret.
#
# ESO writes a Secret named `bridge-broker` with the two keys the Deployment's
# envFrom expects — so deployment.yaml needs NO change. Apply this INSTEAD of
# secret.example.yaml.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: bridge-store
  namespace: britive-bridge
spec:
  provider:
    # AWS Secrets Manager example. Swap for vault/gcpsm/azurekv as needed.
    aws:
      service: SecretsManager
      region: <region>
      auth:
        # Preferred on EKS: IRSA on the ESO service account (no static keys).
        jwt:
          serviceAccountRef:
            name: external-secrets        # the ESO SA bound to an IAM role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bridge-broker
  namespace: britive-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bridge-store
    kind: SecretStore
  target:
    name: bridge-broker                   # the Secret the Deployment consumes
    creationPolicy: Owner
  data:
    - secretKey: BRITIVE_BROKER_TENANT_SUBDOMAIN
      remoteRef:
        key: britive/bridge/broker        # backend secret name
        property: tenantSubdomain         # JSON key within that secret
    - secretKey: BRITIVE_BROKER_AUTH_TOKEN
      remoteRef:
        key: britive/bridge/broker
        property: authToken
