# Britive Bridge broker credentials.
# DO NOT commit a filled-in copy of this file. Create the secret imperatively
# instead (preferred), or fill placeholders and apply, then delete locally.
#
# Preferred — create from the CLI, no plaintext on disk:
#   kubectl -n britive-bridge create secret generic bridge-broker \
#     --from-literal=BRITIVE_BROKER_TENANT_SUBDOMAIN='<your-tenant-subdomain>' \
#     --from-literal=BRITIVE_BROKER_AUTH_TOKEN='<your-broker-auth-token>'
#
# For production, prefer an external secret store (AWS Secrets Manager,
# HashiCorp Vault, Sealed Secrets, External Secrets Operator) over a raw Secret.
apiVersion: v1
kind: Secret
metadata:
  name: bridge-broker
  namespace: britive-bridge
type: Opaque
stringData:
  BRITIVE_BROKER_TENANT_SUBDOMAIN: "<your-tenant-subdomain>"
  BRITIVE_BROKER_AUTH_TOKEN: "<your-broker-auth-token>"
