AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Britive Bridge ECS Fargate deployment.
  ALB terminates TLS with an ACM certificate on port 443.
  Backend target group uses HTTPS on port 8080; ALBs do not validate
  backend certificates, so the container's self-signed cert is accepted.
  SSH private key injected from Secrets Manager for broker → EC2 access.

Parameters:
  StackNamePrefix:
    Type: String
    Default: britive-bridge
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9-]{1,20}"
    Description: >
      Prefix used for named AWS resources. Max 21 characters so derived
      load-balancer and target-group names stay within the 32-character
      ELB limit. Must be unique per deployment in an account/region.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where Bridge will run.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Exactly two public subnets in different AZs for the internet-facing ALB,
      Fargate task, and EFS mount targets (the template creates mount targets
      for the first two subnets only).
  IngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])'
    Description: CIDR allowed to reach Bridge HTTPS on the ALB.
  ImageUri:
    Type: String
    Default: britive/bridge:v1.0.2
    Description: Container image URI. Use a multi-arch image or one that matches CpuArchitecture.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
    Description: ECS task CPU architecture.
  TaskCpu:
    Type: String
    Default: "2048"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
      - "4096"
    Description: Fargate task CPU units.
  TaskMemory:
    Type: String
    Default: "4096"
    AllowedValues:
      - "1024"
      - "2048"
      - "3072"
      - "4096"
      - "5120"
      - "6144"
      - "7168"
      - "8192"
      - "16384"
      - "30720"
    Description: >
      Fargate task memory in MiB. Must be a valid combination for TaskCpu
      (512 CPU: 1024-4096; 1024 CPU: 2048-8192; 2048 CPU: 4096-16384;
      4096 CPU: 8192-30720).
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of Bridge tasks to run.
  BrokerTenantSubdomain:
    Type: String
    Description: Britive broker tenant subdomain, for example acme.
  BrokerAuthToken:
    Type: String
    NoEcho: true
    Description: Britive broker pool authentication token.
  BrokerSSHPrivateKey:
    Type: String
    NoEcho: true
    Description: >
      PEM-encoded private key (ed25519 or RSA) that the broker container uses
      to SSH into EC2 instances. Stored in Secrets Manager and injected at
      runtime — never baked into the container image.
  AcmCertificateArn:
    Type: String
    Description: >
      ARN of the ACM certificate for your domain (e.g. bridge.example.com
      or the wildcard *.example.com). Must be in the same region as the ALB.
  DomainName:
    Type: String
    Default: ""
    Description: >
      DNS name users will reach Bridge on (e.g. bridge.example.com — the name
      your ACM certificate covers). Used only for the BridgeUrl output; leave
      empty to output the raw ALB DNS name instead.

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # ── Logging ───────────────────────────────────────────────────────────────
  BridgeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${StackNamePrefix}
      RetentionInDays: 30

  # ── ECS Cluster ───────────────────────────────────────────────────────────
  BridgeCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${StackNamePrefix}-cluster

  # ── Secrets Manager ───────────────────────────────────────────────────────
  BrokerSSHKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackNamePrefix}/broker/ssh-private-key
      Description: Private key used by the broker ECS task to SSH into EC2 instances
      SecretString: !Ref BrokerSSHPrivateKey

  BrokerAuthTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackNamePrefix}/broker/auth-token
      Description: Britive broker pool authentication token for the bridge ECS task
      SecretString: !Ref BrokerAuthToken

  # ── IAM Roles ─────────────────────────────────────────────────────────────
  BridgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackNamePrefix}-exec-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadBrokerSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref BrokerSSHKeySecret
                  - !Ref BrokerAuthTokenSecret

  BridgeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackNamePrefix}-task-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSExecSSM
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
        # If your checkout/checkin scripts read additional Secrets Manager
        # secrets (e.g. database credentials), grant the task role
        # secretsmanager:GetSecretValue scoped to those specific secret ARNs.

  # ── Security Groups ───────────────────────────────────────────────────────

  # ALB: accepts HTTPS from the world, allows all outbound to ECS tasks
  BridgeAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bridge ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref IngressCidr
        # Port 80 only serves the HTTP → HTTPS redirect listener.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref IngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackNamePrefix}-alb-sg

  # ECS task: only accepts traffic from the ALB security group on port 8080
  BridgeTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bridge task security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref BridgeAlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackNamePrefix}-task-sg

  BridgeEfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bridge EFS security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref BridgeTaskSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackNamePrefix}-efs-sg

  # ── EFS ───────────────────────────────────────────────────────────────────
  BridgeFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      FileSystemTags:
        - Key: Name
          Value: !Sub ${StackNamePrefix}-data

  BridgeAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref BridgeFileSystem
      # The access point forces all NFS operations to uid/gid 0, so the
      # container's non-root user can write /data without matching ownership.
      PosixUser:
        Uid: "0"
        Gid: "0"
      RootDirectory:
        Path: /bridge-data
        CreationInfo:
          OwnerUid: "0"
          OwnerGid: "0"
          Permissions: "0755"

  BridgeMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref BridgeFileSystem
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      SecurityGroups:
        - !Ref BridgeEfsSecurityGroup

  BridgeMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref BridgeFileSystem
      SubnetId: !Select [1, !Ref PublicSubnetIds]
      SecurityGroups:
        - !Ref BridgeEfsSecurityGroup

  # ── ALB ───────────────────────────────────────────────────────────────────
  BridgeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${StackNamePrefix}-alb
      Scheme: internet-facing
      Type: application                     # ALB, not NLB
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref BridgeAlbSecurityGroup

  # Target group uses HTTPS so traffic to the container stays encrypted.
  # ALBs never validate backend certificates, so the container's self-signed
  # cert is accepted — no extra configuration needed for that.
  BridgeApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${StackNamePrefix}-api-https
      VpcId: !Ref VpcId
      Protocol: HTTPS                       # encrypted ALB → container
      Port: 8080
      TargetType: ip
      TargetGroupAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
      HealthCheckProtocol: HTTPS
      HealthCheckPort: "8080"
      HealthCheckPath: /api/health          # bridge health endpoint
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  # HTTPS:443 listener with ACM cert — terminates TLS at the ALB
  BridgeApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BridgeLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BridgeApiTargetGroup

  # Optional: redirect HTTP → HTTPS
  BridgeHttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BridgeLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ── ECS Task Definition ───────────────────────────────────────────────────
  BridgeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackNamePrefix}-task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref CpuArchitecture
      ExecutionRoleArn: !GetAtt BridgeExecutionRole.Arn
      TaskRoleArn: !GetAtt BridgeTaskRole.Arn
      Volumes:
        - Name: bridge-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref BridgeFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref BridgeAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: bridge
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          # Write SSH key to /home/bridge/.ssh before starting the bridge
          # process. SSH_PRIVATE_KEY is injected from Secrets Manager by the
          # ECS agent before this command runs, so it is available as an env
          # var. The stock britive/bridge image config is:
          #   Entrypoint=["/entrypoint.sh"], Cmd=none, User=bridge
          # so exec'ing /entrypoint.sh reproduces the default startup. If you
          # use a custom ImageUri, confirm its entrypoint matches:
          #   docker inspect <image> --format '{{json .Config.Entrypoint}}'
          EntryPoint:
            - "/bin/sh"
            - "-c"
          Command:
            # unset drops the key from the bridge process env (it lives only
            # in the key file from here on).
            - "mkdir -p /home/bridge/.ssh && echo \"$SSH_PRIVATE_KEY\" > /home/bridge/.ssh/id_ed25519 && chmod 700 /home/bridge/.ssh && chmod 600 /home/bridge/.ssh/id_ed25519 && unset SSH_PRIVATE_KEY && exec /entrypoint.sh"
          Environment:
            - Name: BRITIVE_BROKER_TENANT_SUBDOMAIN
              Value: !Ref BrokerTenantSubdomain
          Secrets:
            # Injected by the ECS agent at task start; kept out of the task
            # definition so ecs:DescribeTaskDefinition does not expose them.
            - Name: BRITIVE_BROKER_AUTH_TOKEN
              ValueFrom: !Ref BrokerAuthTokenSecret
            - Name: SSH_PRIVATE_KEY
              ValueFrom: !Ref BrokerSSHKeySecret
          MountPoints:
            - SourceVolume: bridge-data
              ContainerPath: /data
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BridgeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bridge

  # ── ECS Service ───────────────────────────────────────────────────────────
  BridgeService:
    Type: AWS::ECS::Service
    DependsOn:
      - BridgeApiListener
      - BridgeMountTargetA
      - BridgeMountTargetB
    Properties:
      ServiceName: !Sub ${StackNamePrefix}-service
      Cluster: !Ref BridgeCluster
      TaskDefinition: !Ref BridgeTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref BridgeTaskSecurityGroup
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: bridge
          ContainerPort: 8080
          TargetGroupArn: !Ref BridgeApiTargetGroup

Outputs:
  ClusterName:
    Value: !Ref BridgeCluster
  ServiceName:
    Value: !Ref BridgeService
  LoadBalancerDnsName:
    Value: !GetAtt BridgeLoadBalancer.DNSName
    Description: Point your Route 53 ALIAS record at this value.
  BridgeUrl:
    Description: >-
      External URL for the Britive Bridge resource (BRIDGE_URL). If DomainName
      was left empty this is the raw ALB DNS name, which does NOT match the
      ACM certificate — point your DNS record at the ALB and use that name.
    Value: !If
      - HasDomainName
      - !Sub https://${DomainName}
      - !Sub https://${BridgeLoadBalancer.DNSName}
  DataFileSystemId:
    Value: !Ref BridgeFileSystem
  BrokerSSHKeySecretArn:
    Description: Secrets Manager ARN for the broker SSH private key.
    Value: !Ref BrokerSSHKeySecret
