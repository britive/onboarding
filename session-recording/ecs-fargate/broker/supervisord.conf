[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
stopwaitsecs=10

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=10

[program:britive-broker]
command=/root/start-broker.sh 5
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=20
; Pass ECS-injected secrets into the broker process environment
environment=BRITIVE_TOKEN="%(ENV_BRITIVE_TOKEN)s",BRITIVE_TENANT="%(ENV_BRITIVE_TENANT)s",JSON_SECRET_KEY="%(ENV_JSON_SECRET_KEY)s"
