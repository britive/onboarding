# The Secret the chart reads when secrets.existingSecret is set, produced by
# External Secrets Operator from AWS Secrets Manager. With an existing Secret
# the chart renders none of its own, so this one must carry the datastore
# connection too, not only the passwords.
#
# Secrets Manager layout assumed (one JSON secret):
#   bridge/prod = {
#     "clusterToken": "<openssl rand -hex 32>",
#     "encryptionKeyB64": "<openssl rand -base64 32 - permanent, back it up>",
#     "hostKeySeed": "<openssl rand -hex 32>",
#     "brokerAuthToken": "<broker pool token from ../../platform-setup/>",
#     "datastorePassword": "<RDS password>"
#   }
#
# Prerequisites: External Secrets Operator installed, and a ClusterSecretStore
# named aws-secrets-manager whose IRSA role may read secrets under bridge/*.
# Equivalents: provider gcpsm (Secret Manager) or azurekv (Key Vault) in the
# store; the template below is provider-independent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bridge-secrets
  namespace: bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: bridge-secrets # = secrets.existingSecret in values.yaml
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        BRIDGE_CLUSTER_TOKEN: "{{ .clusterToken }}"
        BRIDGE_ENCRYPTION_KEY_B64: "{{ .encryptionKeyB64 }}"
        BRIDGE_HOST_KEY_SEED: "{{ .hostKeySeed }}"
        BRITIVE_BROKER_AUTH_TOKEN: "{{ .brokerAuthToken }}"
        # Datastore connection. Not secret, but the chart expects them here.
        BRIDGE_DATASTORE_HOST: bridge-db.cluster-xxxxxxxx.<region>.rds.amazonaws.com
        BRIDGE_DATASTORE_PORT: "5432"
        BRIDGE_DATASTORE_USER: bridge
        BRIDGE_DATASTORE_NAME: bridge
        BRIDGE_DATASTORE_SSLMODE: require
        BRIDGE_DATASTORE_PASSWORD: "{{ .datastorePassword }}"
  dataFrom:
    - extract:
        key: bridge/prod
