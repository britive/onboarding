{{- if not .Values.britive.existingSecret.name }}
{{- if not .Values.britive.authToken }}
{{- fail "Set britive.authToken, or britive.existingSecret.name for a Secret you manage" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "britive-broker.fullname" . }}
  labels:
    {{- include "britive-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.britive.existingSecret.key }}: {{ .Values.britive.authToken | quote }}
{{- end }}
