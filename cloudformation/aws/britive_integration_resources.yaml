AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Britive AWS integration for one account: the SAML identity provider and the
  integration role Britive assumes to scan the account, with optional
  permissions for session invalidation, Access Builder and AI identity
  scanning, and optional sample JIT roles for demonstrations. In the
  management account it can also grant the permissions the AWS Identity Center
  and AWS Account Access application types need on the same role. Deploy it as
  a stack in a single account, as a StackSet across an organization, or as the
  nested template of organization-stackset/. Matches
  docs.britive.com/docs/configuring-identity-provider, configuring-iam-roles,
  configuring-for-session-invalidation, configuring-iam-roles-in-awsidentitycenter
  and enable-account-access-manager.

Metadata:
  cfn-lint:
    config:
      # W1030: AccountAccessApplicationArn is intentionally empty unless
      # DeployAccountAccess is true; the AccountAccessNeedsApplicationArn
      # rule below enforces a real ARN whenever the policy is deployed.
      ignore_checks: [W1030]
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Britive tenant
        Parameters:
          - TenantName
          - SamlMetadataDocumentXmlContent
      - Label:
          default: Optional permissions
        Parameters:
          - DeployAwsInvalidationFeature
          - DeployAccessBuilder
          - DeployAiIdentityScanning
          - MaxSessionDuration
      - Label:
          default: AWS Identity Center and AWS Account Access (management account only)
        Parameters:
          - DeployIdentityCenter
          - DeployAccountAccess
          - AccountAccessApplicationArn
      - Label:
          default: Demonstration
        Parameters:
          - DeploySampleRoles
    ParameterLabels:
      TenantName:
        default: Tenant subdomain (acme for acme.britive-app.com)
      SamlMetadataDocumentXmlContent:
        default: SAML metadata XML (System Administration > Security > SAML Configurations > Download SAML Metadata)
      DeployAwsInvalidationFeature:
        default: Session invalidation permissions
      DeployAccessBuilder:
        default: Access Builder permissions
      DeployAiIdentityScanning:
        default: AI identity scanning (AmazonBedrockReadOnly)
      MaxSessionDuration:
        default: Integration role maximum session duration (seconds)
      DeployIdentityCenter:
        default: AWS Identity Center permissions (identitystore, sso, organizations)
      DeployAccountAccess:
        default: AWS Account Access permissions (account-access entitlements)
      AccountAccessApplicationArn:
        default: Account access manager application ARN (arn:aws:account-access:...), required with the option above
      DeploySampleRoles:
        default: Create four sample JIT roles

Parameters:
  TenantName:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9-]*$"
    ConstraintDescription: letters, digits and hyphens only; the part before .britive-app.com
    Description: Britive tenant subdomain, without ".britive-app.com". Names the provider britive-<tenant> and the role britive-<tenant>-integration-role.
  SamlMetadataDocumentXmlContent:
    Type: String
    MinLength: 100
    ConstraintDescription: paste the metadata XML itself, not a file path
    Description: Contents of the SAML metadata XML downloaded from the Britive tenant.
  DeployAwsInvalidationFeature:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Grant the IAM policy permissions Britive's session-invalidation feature needs, scoped to policy/britive/managed/* in this account.
  DeployAccessBuilder:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Grant the IAM role permissions Britive Access Builder needs to create Britive-managed roles, scoped to role/britive/managed/* in this account.
  DeployAiIdentityScanning:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Attach AmazonBedrockReadOnly so Britive can scan AI identities.
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum session duration of the integration role in seconds. Enter the same value, in hours, as "Duration of backend connection" when creating the AWS application in Britive.
  DeployIdentityCenter:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Management account only. Grant the Identity Center, Organizations and IAM policy read permissions the Britive "AWS Identity Center" application needs to scan permission sets, groups and applications and to assign them at checkout.
  DeployAccountAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Management account only. Grant the account access manager permissions the Britive "AWS Account Access" application needs to create and delete entitlements. Requires AccountAccessApplicationArn. Enable the account access manager in the Identity Center primary region first.
  AccountAccessApplicationArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:aws[a-z-]*:account-access:[a-z0-9-]+:[0-9]{12}:application/.+)?$"
    ConstraintDescription: the ARN from the account access manager Settings page, beginning arn:aws:account-access:, or empty
    Description: >-
      ARN of the account access manager application, from its Settings page in the management account
      (begins with arn:aws:account-access:). Not the "AWS account access" application listed in IAM
      Identity Center, whose ARN begins with "arn:aws:sso::" and fails the connection test.
  DeploySampleRoles:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create Readonly-admin-role, Poweruser-role, EC2-Fullaccess-role and S3-Fullaccess-role, trusting the Britive SAML provider, for demonstrations.

Rules:
  AccountAccessNeedsApplicationArn:
    RuleCondition: !Equals [!Ref DeployAccountAccess, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref AccountAccessApplicationArn, ""]]
        AssertDescription: DeployAccountAccess=true requires AccountAccessApplicationArn (the account access manager Settings page in the management account shows it).

Conditions:
  Invalidation: !Equals [!Ref DeployAwsInvalidationFeature, "true"]
  AccessBuilder: !Equals [!Ref DeployAccessBuilder, "true"]
  AiScanning: !Equals [!Ref DeployAiIdentityScanning, "true"]
  IdentityCenter: !Equals [!Ref DeployIdentityCenter, "true"]
  AccountAccess: !Equals [!Ref DeployAccountAccess, "true"]
  SampleRoles: !Equals [!Ref DeploySampleRoles, "true"]

Resources:
  BritiveSamlProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: !Sub britive-${TenantName}
      SamlMetadataDocument: !Ref SamlMetadataDocumentXmlContent

  # Assumed by Britive to scan the account. Every role Britive brokers must
  # grant the same three actions: SetSourceIdentity is required once a Source
  # Identity attribute is configured on the application, TagSession by
  # session invalidation.
  BritiveIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub britive-${TenantName}-integration-role
      Description: Assumed by Britive to scan this account and, optionally, manage Britive-managed policies and roles
      MaxSessionDuration: !Ref MaxSessionDuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMReadOnlyAccess
        # Needed in the management account to discover the organization;
        # harmless in member accounts, where it returns nothing.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !If
          - AiScanning
          - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockReadOnly
          - !Ref AWS::NoValue

  # Session invalidation: Britive writes deny policies under policy/britive/managed/
  # to cut live sessions short. Pair with the SCP in scp/ so nothing but this
  # role can touch that path.
  BritiveInvalidationPolicy:
    Type: AWS::IAM::Policy
    Condition: Invalidation
    Properties:
      PolicyName: britive-aws-invalidation
      Roles:
        - !Ref BritiveIntegrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/britive/managed/*

  # Access Builder: Britive creates and removes roles under role/britive/managed/.
  BritiveAccessBuilderPolicy:
    Type: AWS::IAM::Policy
    Condition: AccessBuilder
    Properties:
      PolicyName: britive-access-builder
      Roles:
        - !Ref BritiveIntegrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/britive/managed/*

  # AWS Identity Center application: scan permission sets, groups, applications
  # and accounts, and assign/unassign them at checkout and checkin. The action
  # list is the one Britive documents; the Identity Center APIs do not support
  # resource-level scoping for most of it.
  BritiveIdentityCenterPolicy:
    Type: AWS::IAM::Policy
    Condition: IdentityCenter
    Properties:
      PolicyName: britive-identity-center
      Roles:
        - !Ref BritiveIntegrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicies
              - iam:ListPolicyVersions
              - identitystore:CreateGroupMembership
              - identitystore:DeleteGroupMembership
              - identitystore:DescribeGroup
              - identitystore:DescribeGroupMembership
              - identitystore:DescribeUser
              - identitystore:GetGroupId
              - identitystore:GetGroupMembershipId
              - identitystore:GetUserId
              - identitystore:IsMemberInGroups
              - identitystore:ListGroupMemberships
              - identitystore:ListGroupMembershipsForMember
              - identitystore:ListGroups
              - identitystore:ListUsers
              - organizations:DescribeAccount
              - organizations:DescribeOrganization
              - organizations:DescribeOrganizationalUnit
              - organizations:ListAccounts
              - organizations:ListAccountsForParent
              - organizations:ListChildren
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListParents
              - organizations:ListRoots
              - organizations:ListTagsForResource
              - sso:CreateAccountAssignment
              - sso:CreateApplicationAssignment
              - sso:DeleteAccountAssignment
              - sso:DeleteApplicationAssignment
              - sso:DescribeAccountAssignmentCreationStatus
              - sso:DescribeAccountAssignmentDeletionStatus
              - sso:DescribeApplication
              - sso:DescribeApplicationAssignment
              - sso:DescribeInstance
              - sso:DescribePermissionSet
              - sso:DescribePermissionSetProvisioningStatus
              - sso:GetInlinePolicyForPermissionSet
              - sso:GetPermissionSet
              - sso:ListAccountAssignmentCreationStatus
              - sso:ListAccountAssignmentDeletionStatus
              - sso:ListAccountAssignments
              - sso:ListAccountAssignmentsForPrincipal
              - sso:ListAccountsForProvisionedPermissionSet
              - sso:ListApplicationAssignments
              - sso:ListApplicationAssignmentsForPrincipal
              - sso:ListApplications
              - sso:ListCustomerManagedPolicyReferencesInPermissionSet
              - sso:ListInstances
              - sso:ListManagedPoliciesInPermissionSet
              - sso:ListPermissionSets
              - sso:ListPermissionSetsProvisionedToAccount
              - sso:ListTagsForResource
              - sso:ProvisionPermissionSet
            Resource: "*"

  # AWS Account Access application: Britive creates an entitlement at checkout
  # and deletes it at checkin. ListApplications is what "Save and Test" uses
  # to confirm the ARN exists; AWS offers no resource-level scoping for it.
  BritiveAccountAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: AccountAccess
    Metadata:
      cfn-lint:
        config:
          # W3037: cfn-lint's IAM service list predates the account-access
          # prefix; the actions are the ones AWS and Britive document.
          ignore_checks: [W3037]
    Properties:
      PolicyName: britive-account-access
      Roles:
        - !Ref BritiveIntegrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DiscoverApplications
            Effect: Allow
            Action: account-access:ListApplications
            Resource: "*"
          - Sid: ManageEntitlements
            Effect: Allow
            Action:
              - account-access:ListEntitlements
              - account-access:CreateEntitlement
              - account-access:DeleteEntitlement
            Resource: !Ref AccountAccessApplicationArn

  # Sample JIT roles for demonstrations. Each trusts the Britive SAML provider
  # exactly as a production role must.
  SampleReadOnlyRole:
    Type: AWS::IAM::Role
    Condition: SampleRoles
    Properties:
      RoleName: Readonly-admin-role
      Description: "Sample Britive JIT role: read-only access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess

  SamplePowerUserRole:
    Type: AWS::IAM::Role
    Condition: SampleRoles
    Properties:
      RoleName: Poweruser-role
      Description: "Sample Britive JIT role: PowerUserAccess"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess

  SampleEc2AdminRole:
    Type: AWS::IAM::Role
    Condition: SampleRoles
    Properties:
      RoleName: EC2-Fullaccess-role
      Description: "Sample Britive JIT role: EC2 full access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2FullAccess

  SampleS3AdminRole:
    Type: AWS::IAM::Role
    Condition: SampleRoles
    Properties:
      RoleName: S3-Fullaccess-role
      Description: "Sample Britive JIT role: S3 full access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess

Outputs:
  AccountId:
    Description: Enter as the account ID (or Management Account ID) in the Britive application.
    Value: !Ref AWS::AccountId
  BritiveSamlProviderName:
    Description: Enter as "Identity Provider Name" in the Britive application.
    Value: !Sub britive-${TenantName}
  BritiveSamlProviderArn:
    Value: !Ref BritiveSamlProvider
  BritiveIntegrationRoleName:
    Description: Enter as "Integration Role Name" in the Britive application (the name, not the ARN).
    Value: !Ref BritiveIntegrationRole
  BritiveIntegrationRoleArn:
    Value: !GetAtt BritiveIntegrationRole.Arn
  MaxSessionDurationSeconds:
    Description: Divide by 3600 and enter as "Duration of backend connection" (hours) in the Britive application.
    Value: !Ref MaxSessionDuration
  AccountAccessApplicationArn:
    Condition: AccountAccess
    Description: Enter as "AWS Account Access Application ARN" in the Britive AWS Account Access application.
    Value: !Ref AccountAccessApplicationArn
  SampleReadOnlyRoleArn:
    Condition: SampleRoles
    Value: !GetAtt SampleReadOnlyRole.Arn
  SamplePowerUserRoleArn:
    Condition: SampleRoles
    Value: !GetAtt SamplePowerUserRole.Arn
  SampleEc2AdminRoleArn:
    Condition: SampleRoles
    Value: !GetAtt SampleEc2AdminRole.Arn
  SampleS3AdminRoleArn:
    Condition: SampleRoles
    Value: !GetAtt SampleS3AdminRole.Arn
