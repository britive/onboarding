AWSTemplateFormatVersion: 2010-09-09
Description: >
  Complete Britive Integration Infrastructure Stack for Demo/Lab Environments.

  This template creates a full demo environment including:
  - Britive SAML integration (identity provider and integration role)
  - VPC with public subnets for demo resources
  - EC2 instances (Linux and Windows) for testing access
  - RDS MySQL database with encrypted credentials
  - Sample JIT roles for demonstrating Britive access management

  WARNING: This template is for DEMO/LAB use only. Security groups are intentionally
  permissive (0.0.0.0/0) for ease of access. Do NOT use in production environments.

  For production deployments, use the single-account-stack or stackset-templates.

# =============================================================================
# PARAMETERS
# =============================================================================
# These parameters must be provided when creating the stack.
# TenantName and SamlMetadataDocumentXmlContent are obtained from your Britive tenant.

Parameters:
  TenantName:
    Description: Name of the Britive tenant. Omit ".britive-app.com".
    Type: String
  SamlMetadataDocumentXmlContent:
    Description: The XML content of the SAML metadata document downloaded from the Britive tenant.
    Type: String
  DeployAwsInvalidationFeature:
    Description: Enable AWS Invalidation feature permissions.
    Type: String
    AllowedValues: [true, false]
    Default: true

# =============================================================================
# CONDITIONS
# =============================================================================

Conditions:
  # Determines whether to deploy the AWS Invalidation feature permissions
  ShouldDeployAwsInvalidationFeature:
    !Equals [!Ref DeployAwsInvalidationFeature, "true"]

# =============================================================================
# RESOURCES
# =============================================================================

Resources:
  # ---------------------------------------------------------------------------
  # BRITIVE INTEGRATION RESOURCES
  # These resources enable Britive to manage access to this AWS account.
  # ---------------------------------------------------------------------------

  # SAML Identity Provider - Establishes trust between AWS and Britive
  # This allows Britive to authenticate users via SAML federation.
  BritiveSamlProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: !Sub "britive-${TenantName}"
      SamlMetadataDocument: !Ref SamlMetadataDocumentXmlContent

  # Integration Role - Used by Britive to discover and manage IAM roles
  # This role has read-only access to IAM and Organizations to list available roles.
  # The trust policy allows only SAML-authenticated sessions from Britive.
  BritiveIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Principal:
              Federated: !Ref BritiveSamlProvider
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Description: !Sub "Britive Integration Role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSOrganizationsReadOnlyAccess
      MaxSessionDuration: 3600
      RoleName: !Sub "britive-${TenantName}-integration-role"

  BritiveIntegrationRoleInlinePolicyForAwsInvalidation:
    Type: AWS::IAM::Policy
    Condition: ShouldDeployAwsInvalidationFeature
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource: arn:aws:iam::*:policy/britive/managed/*
      PolicyName: aws-invalidation
      Roles:
        - !Ref BritiveIntegrationRole

  # ---------------------------------------------------------------------------
  # SECURITY RESOURCES
  # KMS key and Secrets Manager for secure credential storage.
  # ---------------------------------------------------------------------------

  # KMS Key - Used to encrypt the RDS credentials stored in Secrets Manager
  BritiveKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting RDS password secret
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  RdsPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: BritiveRdsAdminSecret
      Description: RDS admin password secret
      KmsKeyId: !Ref BritiveKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "britive"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  # EC2 Key Pair - Auto-generated for SSH/RDP access to demo instances
  # Note: The private key is stored in AWS Systems Manager Parameter Store
  BritiveEC2KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: britive-keypair
      KeyType: rsa
      Tags:
        - Key: Name
          Value: britive-keypair

  # ---------------------------------------------------------------------------
  # NETWORKING RESOURCES
  # VPC, subnets, and routing for demo infrastructure.
  # All resources are placed in public subnets for easy demo access.
  # ---------------------------------------------------------------------------

  # VPC - Isolated network for demo resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: britive-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: britive-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: britive-subnet-2

  # Internet Gateway - Provides internet access for public subnets
  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # Security Group - DEMO ONLY: Allows SSH, RDP, and MySQL from any IP
  # WARNING: This is intentionally permissive for demo purposes.
  # In production, restrict CidrIp to specific IP ranges.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Britive Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  # ---------------------------------------------------------------------------
  # DATABASE RESOURCES
  # RDS MySQL instance for demonstrating database access via Britive.
  # ---------------------------------------------------------------------------

  # RDS MySQL Instance - Demo database for testing Britive access
  # Credentials are securely stored in Secrets Manager
  MySQLRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: britive-mysql
      Engine: mysql
      MasterUsername:
        !Join [
          "",
          [
            "{{resolve:secretsmanager:",
            !Ref RdsPasswordSecret,
            ":SecretString:username}}",
          ],
        ]
      MasterUserPassword:
        !Join [
          "",
          [
            "{{resolve:secretsmanager:",
            !Ref RdsPasswordSecret,
            ":SecretString:password}}",
          ],
        ]
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      PubliclyAccessible: true
      BackupRetentionPeriod: 7
      VPCSecurityGroups:
        - !Ref SecurityGroup
      DBSubnetGroupName: !Ref RdsSubnetGroup

  # ---------------------------------------------------------------------------
  # COMPUTE RESOURCES
  # EC2 instances for demonstrating server access via Britive.
  # ---------------------------------------------------------------------------

  # Linux EC2 Instance - Amazon Linux 2 for SSH access demos
  LinuxEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"
      KeyName: !Ref BritiveEC2KeyPair
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: Britive-Linux

  # Windows EC2 Instance - Windows Server 2019 for RDP access demos
  WindowsEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-windows-latest/Windows_Server-2019-English-Full-Base}}"
      KeyName: !Ref BritiveEC2KeyPair
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: Britive-Windows

  # ---------------------------------------------------------------------------
  # SAMPLE JIT ROLES
  # These roles demonstrate Just-In-Time (JIT) access patterns with Britive.
  # Users can check out these roles through Britive to gain temporary access.
  # Each role trusts the Britive SAML provider for federated authentication.
  # ---------------------------------------------------------------------------

  # ReadOnly Role - For users who need view-only access to AWS resources
  BritiveReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: "Readonly-admin-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 3600
      Description: Britive ReadOnly Role for limited access

  # PowerUser Role - For developers who need broad access but not IAM management
  BritivePowerUserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: !Sub "Poweruser-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      MaxSessionDuration: 3600
      Description: Elevated access role for Britive users

  # EC2 Admin Role - For users who need full EC2 management access
  BritiveEC2AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: "EC2-Fullaccess-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      MaxSessionDuration: 3600
      Description: Britive EC2 Admin Role for full EC2 access

  # S3 Admin Role - For users who need full S3 management access
  BritiveS3AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: !Sub "S3-Fullaccess-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      MaxSessionDuration: 3600
      Description: Elevated access role for Britive users

# =============================================================================
# OUTPUTS
# =============================================================================
# These outputs provide important information after stack creation.
# Use these values to configure your Britive tenant and access resources.

Outputs:
  BritiveSamlProviderArn:
    Description: ARN of the Britive SAML Provider
    Value: !Ref BritiveSamlProvider
  BritiveIntegrationRoleArn:
    Description: ARN of the Britive Integration Role
    Value: !GetAtt BritiveIntegrationRole.Arn
  BritiveIntegrationRoleName:
    Description: Name of the Britive Integration Role
    Value: !Ref BritiveIntegrationRole
  VpcId:
    Description: ID of the created VPC
    Value: !Ref VPC
  LinuxInstanceId:
    Description: Instance ID of the Linux EC2 instance
    Value: !Ref LinuxEC2Instance
  WindowsInstanceId:
    Description: Instance ID of the Windows EC2 instance
    Value: !Ref WindowsEC2Instance
  RdsEndpoint:
    Description: Endpoint address of the RDS MySQL instance
    Value: !GetAtt MySQLRDSInstance.Endpoint.Address
  RdsSecretArn:
    Description: ARN of the Secrets Manager secret containing RDS credentials
    Value: !Ref RdsPasswordSecret
  EC2KeyPairName:
    Description: Name of the EC2 key pair
    Value: !Ref BritiveEC2KeyPair
