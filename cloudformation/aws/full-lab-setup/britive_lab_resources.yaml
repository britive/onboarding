AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Britive AWS lab for demonstrations and proofs of concept: the integration
  (SAML provider, integration role, optional session invalidation), four
  sample JIT roles, and targets to use them against - an Amazon Linux 2023
  instance, a Windows Server 2022 instance and a MySQL database in their own
  VPC. Billable resources; ingress limited to the CIDR you allow; delete the
  stack when the demonstration is over. Not for production.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Britive tenant
        Parameters:
          - TenantName
          - SamlMetadataDocumentXmlContent
          - DeployAwsInvalidationFeature
      - Label:
          default: Lab access
        Parameters:
          - AllowedIngressCidr
    ParameterLabels:
      TenantName:
        default: Tenant subdomain (acme for acme.britive-app.com)
      SamlMetadataDocumentXmlContent:
        default: SAML metadata XML (System Administration > Security > SAML Configurations > Download SAML Metadata)
      DeployAwsInvalidationFeature:
        default: Session invalidation permissions
      AllowedIngressCidr:
        default: The only CIDR allowed to reach the instances and database (your public IP as a /32)

Parameters:
  TenantName:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9-]*$"
    Description: Britive tenant subdomain, without ".britive-app.com".
  SamlMetadataDocumentXmlContent:
    Type: String
    MinLength: 100
    Description: Contents of the SAML metadata XML downloaded from the Britive tenant.
  DeployAwsInvalidationFeature:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Grant the session-invalidation permissions, scoped to policy/britive/managed/* in this account.
  AllowedIngressCidr:
    Type: String
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    ConstraintDescription: a CIDR such as 203.0.113.10/32
    Description: CIDR allowed to reach SSH, RDP and MySQL. Your public IP as a /32 (curl -s https://checkip.amazonaws.com). 0.0.0.0/0 is rejected.

Rules:
  NoOpenIngress:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedIngressCidr, "0.0.0.0/0"]]
        AssertDescription: AllowedIngressCidr must not be 0.0.0.0/0; use your public IP as a /32.

Conditions:
  Invalidation: !Equals [!Ref DeployAwsInvalidationFeature, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Britive integration (same resources as ../britive_integration_resources.yaml)
  # ---------------------------------------------------------------------------
  BritiveSamlProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: !Sub britive-${TenantName}
      SamlMetadataDocument: !Ref SamlMetadataDocumentXmlContent

  BritiveIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub britive-${TenantName}-integration-role
      Description: Assumed by Britive to scan this account
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess

  BritiveInvalidationPolicy:
    Type: AWS::IAM::Policy
    Condition: Invalidation
    Properties:
      PolicyName: britive-aws-invalidation
      Roles:
        - !Ref BritiveIntegrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/britive/managed/*

  # ---------------------------------------------------------------------------
  # Sample JIT roles. Every role Britive brokers needs this exact trust policy.
  # ---------------------------------------------------------------------------
  SampleReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Readonly-admin-role
      Description: "Sample Britive JIT role: read-only access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess

  SamplePowerUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Poweruser-role
      Description: "Sample Britive JIT role: PowerUserAccess"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess

  SampleEc2AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2-Fullaccess-role
      Description: "Sample Britive JIT role: EC2 full access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2FullAccess

  SampleS3AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: S3-Fullaccess-role
      Description: "Sample Britive JIT role: S3 full access"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess

  # ---------------------------------------------------------------------------
  # KMS key and the database credentials secret
  # ---------------------------------------------------------------------------
  LabKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the lab RDS credentials secret and storage
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  # No fixed Name: a fixed name blocks a second deployment for 30 days after
  # delete (Secrets Manager recovery window).
  RdsPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Lab RDS administrator credentials
      KmsKeyId: !Ref LabKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "britive"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludeCharacters: "\"@/\\'"

  # The private key is stored by EC2 in Parameter Store under
  # /ec2/keypair/<key-pair-id>; see the README for retrieving it.
  LabKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub britive-lab-${TenantName}
      KeyType: ed25519

  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: britive-lab-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: britive-lab-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: britive-lab-subnet-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # Ingress only from AllowedIngressCidr, never the internet.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Britive lab: SSH, RDP and MySQL from the allowed CIDR only"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedIngressCidr
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref AllowedIngressCidr
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref AllowedIngressCidr
      Tags:
        - Key: Name
          Value: britive-lab-sg

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Lab RDS subnet group
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  # Publicly addressable so a laptop in AllowedIngressCidr can connect for the
  # database demo; the security group is what limits who can reach it.
  # DeletionPolicy Delete (not the RDS default Snapshot) so stack deletion does
  # not leave a billed snapshot behind.
  MySQLRDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub britive-lab-${TenantName}
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref LabKmsKey
      DBName: britive
      MasterUsername: !Sub "{{resolve:secretsmanager:${RdsPasswordSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${RdsPasswordSecret}:SecretString:password}}"
      PubliclyAccessible: true
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false
      VPCSecurityGroups:
        - !Ref SecurityGroup
      DBSubnetGroupName: !Ref RdsSubnetGroup

  # ---------------------------------------------------------------------------
  # Instances (current AMIs via SSM public parameters, IMDSv2, encrypted disks).
  # IMDSv2 is a launch-template setting, hence one template per instance.
  # ---------------------------------------------------------------------------
  LinuxLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub britive-lab-${TenantName}-linux
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              Encrypted: true
              VolumeType: gp3

  LinuxEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LinuxLaunchTemplate
        Version: !GetAtt LinuxLaunchTemplate.LatestVersionNumber
      InstanceType: t3.micro
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      KeyName: !Ref LabKeyPair
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: Britive-Linux

  WindowsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub britive-lab-${TenantName}-windows
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeType: gp3

  WindowsEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WindowsLaunchTemplate
        Version: !GetAtt WindowsLaunchTemplate.LatestVersionNumber
      InstanceType: t3.small
      ImageId: "{{resolve:ssm:/aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base}}"
      KeyName: !Ref LabKeyPair
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: Britive-Windows

Outputs:
  AccountId:
    Description: Enter as the account ID in the Britive application.
    Value: !Ref AWS::AccountId
  BritiveSamlProviderName:
    Description: Enter as "Identity Provider Name".
    Value: !Sub britive-${TenantName}
  BritiveIntegrationRoleName:
    Description: Enter as "Integration Role Name".
    Value: !Ref BritiveIntegrationRole
  BackendConnectionDurationHours:
    Description: Enter as "Duration of backend connection".
    Value: "1"
  SampleReadOnlyRoleArn:
    Value: !GetAtt SampleReadOnlyRole.Arn
  SamplePowerUserRoleArn:
    Value: !GetAtt SamplePowerUserRole.Arn
  SampleEc2AdminRoleArn:
    Value: !GetAtt SampleEc2AdminRole.Arn
  SampleS3AdminRoleArn:
    Value: !GetAtt SampleS3AdminRole.Arn
  VpcId:
    Value: !Ref VPC
  LinuxInstancePublicIp:
    Description: ssh -i lab-key.pem ec2-user@<ip>
    Value: !GetAtt LinuxEC2Instance.PublicIp
  WindowsInstanceId:
    Description: aws ec2 get-password-data --instance-id <id> --priv-launch-key lab-key.pem
    Value: !Ref WindowsEC2Instance
  WindowsInstancePublicIp:
    Value: !GetAtt WindowsEC2Instance.PublicIp
  RdsEndpoint:
    Value: !GetAtt MySQLRDSInstance.Endpoint.Address
  RdsSecretArn:
    Description: Secrets Manager secret with the MySQL administrator credentials.
    Value: !Ref RdsPasswordSecret
  KeyPairId:
    Description: The private key is in Parameter Store at /ec2/keypair/<this id>; see the README.
    Value: !GetAtt LabKeyPair.KeyPairId
