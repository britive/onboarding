AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Britive AWS integration for a whole organization in one stack, run from the
  management account: a nested stack creates the resources in the management
  account itself (service-managed StackSets cannot target it, and the Britive
  "AWS" application type needs them there), and a service-managed StackSet
  with auto-deployment creates the same resources in every member account
  under the target OUs, including accounts that join later. Both use
  ../britive_integration_resources.yaml, which you upload to an S3 bucket in
  the management account first.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Template location (upload ../britive_integration_resources.yaml first)
        Parameters:
          - S3BucketName
          - S3KeyForIamResourcesTemplate
      - Label:
          default: Organization targets
        Parameters:
          - OrganizationalUnitIds
          - Region
          - CallAs
      - Label:
          default: Britive tenant
        Parameters:
          - TenantName
          - SamlMetadataDocumentXmlContent
      - Label:
          default: Optional permissions
        Parameters:
          - DeployAwsInvalidationFeature
          - DeployAccessBuilder
          - DeployAiIdentityScanning
          - DeploySampleRoles
    ParameterLabels:
      S3BucketName:
        default: S3 bucket (same region as this stack) holding britive_integration_resources.yaml
      S3KeyForIamResourcesTemplate:
        default: Object key of the template in that bucket
      OrganizationalUnitIds:
        default: OU IDs to deploy to (the root ID r-xxxx for the whole organization)
      Region:
        default: Region for the member-account stacks (IAM is global; one is enough)
      CallAs:
        default: SELF from the management account, DELEGATED_ADMIN from a delegated administrator
      TenantName:
        default: Tenant subdomain (acme for acme.britive-app.com)
      SamlMetadataDocumentXmlContent:
        default: SAML metadata XML (System Administration > Security > SAML Configurations > Download SAML Metadata)

Parameters:
  S3BucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Bucket in the management account, in the same region as this stack, that holds britive_integration_resources.yaml. Does not need to be public.
  S3KeyForIamResourcesTemplate:
    Type: String
    Default: britive_integration_resources.yaml
    Description: Object key of the template in the bucket. No leading slash.
  OrganizationalUnitIds:
    Type: CommaDelimitedList
    Description: OU IDs the StackSet deploys to, comma separated. Use the root ID (r-xxxx) for every account in the organization.
  Region:
    Type: String
    Default: us-east-1
    Description: Region for the member-account stacks. The resources are global IAM resources, so a single region is enough.
  CallAs:
    Type: String
    Default: SELF
    AllowedValues: [SELF, DELEGATED_ADMIN]
    Description: SELF when deploying from the management account; DELEGATED_ADMIN when deploying from a CloudFormation StackSets delegated administrator account.
  TenantName:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9-]*$"
    Description: Britive tenant subdomain, without ".britive-app.com".
  SamlMetadataDocumentXmlContent:
    Type: String
    MinLength: 100
    Description: Contents of the SAML metadata XML downloaded from the Britive tenant.
  DeployAwsInvalidationFeature:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Session-invalidation permissions, in the management account and every member account.
  DeployAccessBuilder:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Access Builder permissions, in the management account and every member account.
  DeployAiIdentityScanning:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: AmazonBedrockReadOnly, in the management account and every member account.
  DeploySampleRoles:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create the four sample JIT roles in every account. Demonstrations only.

Resources:
  ManagementAccountStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${S3BucketName}.s3.${AWS::Region}.amazonaws.com/${S3KeyForIamResourcesTemplate}
      TimeoutInMinutes: 20
      Parameters:
        TenantName: !Ref TenantName
        SamlMetadataDocumentXmlContent: !Ref SamlMetadataDocumentXmlContent
        DeployAwsInvalidationFeature: !Ref DeployAwsInvalidationFeature
        DeployAccessBuilder: !Ref DeployAccessBuilder
        DeployAiIdentityScanning: !Ref DeployAiIdentityScanning
        DeploySampleRoles: !Ref DeploySampleRoles

  MemberAccountsStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: !Sub britive-resources-${TenantName}
      Description: Britive SAML identity provider and integration role in every member account
      PermissionModel: SERVICE_MANAGED
      CallAs: !Ref CallAs
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      ManagedExecution:
        Active: true
      OperationPreferences:
        FailureToleranceCount: 10
        MaxConcurrentCount: 10
        RegionConcurrencyType: PARALLEL
      TemplateURL: !Sub https://${S3BucketName}.s3.${AWS::Region}.amazonaws.com/${S3KeyForIamResourcesTemplate}
      Parameters:
        - ParameterKey: TenantName
          ParameterValue: !Ref TenantName
        - ParameterKey: SamlMetadataDocumentXmlContent
          ParameterValue: !Ref SamlMetadataDocumentXmlContent
        - ParameterKey: DeployAwsInvalidationFeature
          ParameterValue: !Ref DeployAwsInvalidationFeature
        - ParameterKey: DeployAccessBuilder
          ParameterValue: !Ref DeployAccessBuilder
        - ParameterKey: DeployAiIdentityScanning
          ParameterValue: !Ref DeployAiIdentityScanning
        - ParameterKey: DeploySampleRoles
          ParameterValue: !Ref DeploySampleRoles
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Ref OrganizationalUnitIds
          Regions:
            - !Ref Region

Outputs:
  ManagementAccountId:
    Description: Enter as "Management Account ID" in the Britive AWS application.
    Value: !Ref AWS::AccountId
  IdentityProviderName:
    Description: Enter as "Identity Provider Name". The same name exists in every member account.
    Value: !Sub britive-${TenantName}
  IntegrationRoleName:
    Description: Enter as "Integration Role Name" (the name, not the ARN). The same name exists in every member account.
    Value: !Sub britive-${TenantName}-integration-role
  BackendConnectionDurationHours:
    Description: Enter as "Duration of backend connection" in the Britive application.
    Value: "1"
  StackSetName:
    Description: StackSet deploying the member-account resources; list instances with aws cloudformation list-stack-instances.
    Value: !Ref MemberAccountsStackSet
