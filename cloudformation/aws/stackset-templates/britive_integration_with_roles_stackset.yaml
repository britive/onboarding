AWSTemplateFormatVersion: 2010-09-09
Description: StackSet template to deploy Britive integration resources with sample JIT roles across multiple AWS accounts in an organization or folder. Includes ReadOnly, PowerUser, EC2 Admin, and S3 Admin roles for testing.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Britive Configuration
        Parameters:
          - TenantName
          - SamlMetadataDocumentXmlContent
          - DeployAwsInvalidationFeature
    ParameterLabels:
      SamlMetadataDocumentXmlContent:
        default: SAML Metadata Document XML
      TenantName:
        default: Britive Tenant Name
      DeployAwsInvalidationFeature:
        default: Enable AWS Invalidation Feature
Parameters:
  SamlMetadataDocumentXmlContent:
    Description: The XML content of the SAML metadata document downloaded from the Britive tenant.
    Type: String
  TenantName:
    Description: Name of the Britive tenant. Omit ".britive-app.com".
    Type: String
  DeployAwsInvalidationFeature:
    Description: A flag used to indicate whether additional IAM permissions should be added to the integration role in support of the Britive AWS Invalidation feature.
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
Conditions:
  ShouldDeployAwsInvalidationFeature:
    !Equals [!Ref DeployAwsInvalidationFeature, true]
Resources:
  BritiveSamlProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: !Sub "britive-${TenantName}"
      SamlMetadataDocument: !Ref SamlMetadataDocumentXmlContent
  BritiveIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Principal:
              Federated: !Ref BritiveSamlProvider
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Description: !Sub "Britive Integration Role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSOrganizationsReadOnlyAccess
      MaxSessionDuration: 10800
      RoleName: !Sub "britive-${TenantName}-integration-role"
  BritiveIntegrationRoleInlinePolicyForAwsInvalidation:
    Type: AWS::IAM::Policy
    Condition: ShouldDeployAwsInvalidationFeature
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource: arn:aws:iam::*:policy/britive/managed/*
      PolicyName: aws-invalidation
      Roles:
        - !Ref BritiveIntegrationRole

  # ----- Create Test Roles to Integrate with Britive and prove JIT use-cases ---- #

  BritiveReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: "Readonly-admin-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 10800
      Description: Britive ReadOnly Role for limited access

  BritivePowerUserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: !Sub "Poweruser-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      MaxSessionDuration: 10800
      Description: Elevated access role for Britive users

  BritiveEC2AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: "EC2-Fullaccess-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      MaxSessionDuration: 10800
      Description: Britive ReadOnly Role for limited access

  BritiveS3AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref BritiveSamlProvider
            Action:
              - sts:AssumeRoleWithSAML
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      RoleName: !Sub "S3-Fullaccess-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      MaxSessionDuration: 10800
      Description: Elevated access role for Britive users

Outputs:
  BritiveSamlProviderArn:
    Description: ARN of the Britive SAML Provider
    Value: !Ref BritiveSamlProvider
  BritiveIntegrationRoleArn:
    Description: ARN of the Britive Integration Role
    Value: !GetAtt BritiveIntegrationRole.Arn
  BritiveIntegrationRoleName:
    Description: Name of the Britive Integration Role
    Value: !Ref BritiveIntegrationRole
  BritiveReadOnlyRoleArn:
    Description: ARN of the Britive ReadOnly Role
    Value: !GetAtt BritiveReadOnlyRole.Arn
  BritivePowerUserRoleArn:
    Description: ARN of the Britive PowerUser Role
    Value: !GetAtt BritivePowerUserRole.Arn
  BritiveEC2AdminRoleArn:
    Description: ARN of the Britive EC2 Admin Role
    Value: !GetAtt BritiveEC2AdminRole.Arn
  BritiveS3AdminRoleArn:
    Description: ARN of the Britive S3 Admin Role
    Value: !GetAtt BritiveS3AdminRole.Arn
